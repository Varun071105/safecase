version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: safecase_db
    restart: always
    environment:
      POSTGRES_USER: safecase_user
      POSTGRES_PASSWORD: safecase_password_2026
      POSTGRES_DB: safecase_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecase_user -d safecase_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safecase_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://safecase_user:safecase_password_2026@db:5432/safecase_db
      SECRET_KEY: safecase-production-super-secret-jwt-key-2026-production
      SMTP_ENABLED: "false"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - evidence_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safecase_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_uploads:
